site_name: UMBFY Packages
site_url: https://docs.umbfy.com
site_description: Official documentation for UMBFY Umbraco packages
repo_name: UMBFY/UMBFY-Packages
repo_url: https://github.com/UMBFY/UMBFY-Packages
edit_uri: edit/main/docs/

copyright: Copyright &copy; UMBFY

theme:
  name: material
  language: en
  custom_dir: overrides
  logo: https://avatars.githubusercontent.com/u/300522069?s=200&v=4
  favicon: https://avatars.githubusercontent.com/u/300522069?s=200&v=4
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/brand.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/UMBFY
      name: UMBFY on GitHub

